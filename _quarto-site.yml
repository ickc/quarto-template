# This site's own settings, merged on top of the shared `_quarto.yml`.
project:
  output-dir: _site
  render:
    - "*.md"
    - "!README.md"
  # The post graph (opt-in; see the README): graph.json and its viewer.
  post-render:
    - paragraphic build --preset quarto --groups directories --exclude 404.html

website:
  title: "Quarto template"
  site-url: "https://ickc.github.io/quarto-template"
  description: "Reference implementation shared by Kolen Cheung's Quarto sites"
  repo-url: https://github.com/ickc/quarto-template
  navbar:
    left:
      - href: index.md
        text: Home
      - href: test.md
        text: Test page
      - href: graph.md
        text: Graph
    right:
      - icon: github
        href: https://github.com/ickc/quarto-template
        aria-label: GitHub
  page-footer:
    left: "© {{< copyright-year 2026 >}} Kolen Cheung · BSD-3-Clause"

format:
  html:
    # The page's own graph card (the post graph, opt-in; see the README).
    include-after-body:
      - _paragraphic.html
