[workspace]
authors = ["Kolen Cheung <10970208+ickc@users.noreply.github.com>"]
name = "quarto-template"
version = "0.1.0"
description = "Reference implementation shared by Kolen Cheung's Quarto sites"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "linux-aarch64"]

[dependencies]
quarto = ">=1.9.38,<2"
python = ">=3.12"
playwright-python = "*"
pyyaml = "*"

[activation]
env = { QUARTO_PORT = "8020" }

# The task names every site uses: build, preview, serve, clean (and check here).
[tasks]
build = { cmd = "quarto render", description = "Render the Quarto site" }
preview = { cmd = "quarto preview --port $QUARTO_PORT --host 0.0.0.0 --no-browser", description = "Live preview on port QUARTO_PORT: quarto re-renders what you save" }
serve = { cmd = "python3 -m http.server $QUARTO_PORT -d _site", description = "Serve the rendered site in _site on port QUARTO_PORT, as is" }
clean = { cmd = "rm -rf _site .quarto", description = "Remove generated files" }
install-browser = { cmd = "playwright install chromium --only-shell", description = "The headless Chromium bin/check-site.py drives (a no-op once installed)" }
check = { cmd = "python bin/check-site.py _site index.html test.html", depends-on = ["build", "install-browser"], description = "Spot-check the rendered site in light and dark" }
merge-config = { cmd = "python bin/merge_config.py", description = "Write DIR/_quarto.yml (default: the current directory) from the shared _quarto.yml and DIR/_quarto-site.yml, for a site that cannot use the shared file as is" }
